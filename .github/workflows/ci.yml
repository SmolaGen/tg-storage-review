name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Запустить тесты
        env:
          JWT_SECRET: test-secret-key-for-ci-only-32bytes
          TG_BOT_TOKEN: test-bot-token-12345
          DATABASE_URL: sqlite+aiosqlite://
        run: |
          pytest tests/ \
            --ignore=tests/test_download.py \
            --ignore=tests/test_file_management.py \
            --ignore=tests/test_telegram_pool.py \
            -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install ruff

      - name: Проверить стиль
        run: ruff check app/

      - name: Проверить форматирование
        run: ruff format app/ --check
