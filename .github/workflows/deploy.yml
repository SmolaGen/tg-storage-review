name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Введите 'deploy' для подтверждения"
        required: true

jobs:
  check-ci:
    name: Проверить результат CI
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    steps:
      - name: CI должен быть успешен
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "CI не прошёл. Деплой отменён."
            exit 1
          fi

  check-confirm:
    name: Проверить подтверждение
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Проверить ввод
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "Требуется ввести 'deploy' для подтверждения."
            exit 1
          fi

  deploy:
    name: Деплой на прод
    runs-on: ubuntu-latest
    needs: [check-ci, check-confirm]
    if: |
      always() &&
      (needs.check-ci.result == 'success' || needs.check-confirm.result == 'success')

    steps:
      - name: Деплой через SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/tg-storage

            git fetch origin master
            git reset --hard origin/master

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "Ждём запуска..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8001/health; then
                echo "Деплой успешен (попытка $i)"
                exit 0
              fi
              echo "Попытка $i не удалась, ждём 5с..."
              sleep 5
            done

            echo "Health check не прошёл за 120 секунд"
            exit 1
