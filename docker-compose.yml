services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tgstorage
      POSTGRES_PASSWORD: tgstorage
      POSTGRES_DB: tgstorage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgstorage"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tg-net

  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - tg-net

volumes:
  pgdata:

networks:
  tg-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
